services:
  - type: web
    name: munaiszntechs
    runtime: docker
    dockerfilePath: ./Dockerfile

    envVars:
      - key: SESSION_ID
        value: ""

      - key: OWNER_NUMBER
        value: ""

      - key: BOT_NAME
        value: "MUNAISZNTECHS™"

      - key: BOT_OWNER
        value: "MUNAISZNTECHS"

      - key: COMMAND_MODE
        value: "public"

      - key: TIMEZONE
        value: "Africa/Nairobi"

      - key: MONGO_URL
        value: ""

      - key: POSTGRES_URL
        value: ""

      - key: MYSQL_URL
        value: ""

      - key: DB_URL
        value: ""

    startCommand: npm run start:optimized
